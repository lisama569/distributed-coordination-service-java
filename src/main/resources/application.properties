server.port=0

# ===== 本地分布式协调服务（进程内模拟，无外部中间件依赖）=====
# 集群节点数，建议奇数；多数派 = floor(n/2)+1
coord.cluster-size=3
# 领导者心跳间隔（模拟毫秒）
coord.heartbeat-interval-millis=50
# 选举随机超时区间（模拟毫秒），各节点确定性抖动、落选后重新抖动
coord.election-timeout-min-millis=180
coord.election-timeout-max-millis=300
# 领导者租约时长（模拟毫秒），必须严格大于选举超时上限，
# 保证“旧领导者租约先过期，新领导者才可能当选”，从根本上杜绝双主
coord.leader-lease-millis=400
# 锁租约默认时长（模拟毫秒）
coord.lock-lease-millis=250
