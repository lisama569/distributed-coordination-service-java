server.port=0
# ---- 分布式协调模拟服务可配置项（逻辑时间，单位毫秒）----
# 模拟集群节点数
coordination.node-count=3
# 选举超时：超过该时间未收到合法领导者心跳即发起新一轮选举
coordination.election-timeout-millis=100
# 领导者心跳间隔
coordination.heartbeat-interval-millis=30
# 领导者租约 TTL：TTL 内未获多数派心跳 ACK 即判定租约失效，拒绝一切写
coordination.lease-ttl-millis=60
# 历史压缩规模阈值：已应用位点相对存档位点每堆积多少条增量就压缩一次，
# 把更早的已提交应用历史压成存档并删除旧日志前缀；存档之外始终保留该数量的最新增量。
# 默认 100：默认交付即开启压缩，写入持续累积时旧日志被真正回收，磁盘规模稳定在阈值附近。
# <=0 表示显式关闭压缩（仅用于对比/特殊场景）。
coordination.compaction-threshold-entries=100
# 设为 true 时，启动应用即在进程内演示选举/租约/分区/幂等恢复/压缩追赶场景
coordination.run-demo-on-startup=false
